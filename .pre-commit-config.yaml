repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python lint
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: black
        name: Python formatting
        entry: .venv/bin/black --check
        language: system
        types: [python]
      - id: secrets
        name: Staged secret scan
        entry: .tools/gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
        always_run: true
